[project]
name = "assistente-arena"
version = "0.1.0"
description = "Companheiro para o MTG Arena: lê o log e a tela (fora das partidas) e só mostra informação."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "httpx>=0.27",
    "keyring>=25",
    "mss>=9",
    "pillow>=10",
    "pydantic>=2.7",
]

[project.scripts]
assistente-arena = "assistente_arena.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistente_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["mss", "mss.*", "keyring", "keyring.*"]
ignore_missing_imports = true
